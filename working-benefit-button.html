<style>
.contact-btn {
    position: fixed !important;
    top: 50% !important;
    right: 20px;
    transform: translateY(-50%) !important;
    width: 160px;
    height: 160px;
    background: linear-gradient(135deg, #FF6B35, #F7931E) !important;
    border-radius: 30px !important;
    box-shadow: 0 12px 35px rgba(255, 107, 53, 0.4) !important;
    cursor: pointer !important;
    z-index: 999999 !important;
    transition: all 0.3s ease !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    color: #ffffff !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    text-align: center !important;
    border: none !important;
    outline: none !important;
    pointer-events: auto !important;
    -webkit-tap-highlight-color: rgba(255, 107, 53, 0.3) !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
}

.contact-btn:hover {
    transform: translateY(-50%) translateX(-10px) scale(1.08) !important;
    box-shadow: 0 18px 50px rgba(255, 107, 53, 0.6) !important;
    background: linear-gradient(135deg, #FF5722, #E65100) !important;
    color: #ffffff !important;
    text-decoration: none !important;
}

.contact-btn:focus,
.contact-btn:visited {
    color: #ffffff !important;
    text-decoration: none !important;
    outline: none !important;
}

.contact-icon {
    font-size: 60px !important;
    margin-bottom: 8px !important;
    animation: bounce-icon 2s infinite !important;
}

.contact-text {
    font-size: 24px !important;
    line-height: 1.1 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3) !important;
}

@keyframes bounce-icon {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
    60% { transform: translateY(-3px); }
}

@media (max-width: 768px) {
    .contact-btn {
        width: 110px !important;
        height: 110px !important;
        right: 15px !important;
        font-size: 15px !important;
    }
    
    .contact-icon {
        font-size: 35px !important;
        margin-bottom: 4px !important;
    }
    
    .contact-text {
        font-size: 16px !important;
    }
}

@media (max-width: 480px) {
    .contact-btn {
        width: 95px !important;
        height: 95px !important;
        right: 10px !important;
    }
    
              .contact-icon {
         font-size: 32px !important;
     }
    
                   .contact-text {
          font-size: 16px !important;
      }
}
</style>

<div class="contact-btn" onclick="findAndScrollToContact(); return false;">
    <div class="contact-icon">🎁</div>
    <div class="contact-text">무료혜택<br>신청하기</div>
</div>

<script>
function findAndScrollToContact() {
    console.log('버튼 클릭됨!'); // 디버깅용
    
    var targetElement = null;
    var found = false;
    
    // 방법 1: "문의하기" 제목 찾기 (최우선)
    var allElements = document.getElementsByTagName('*');
    console.log('전체 요소 개수:', allElements.length);
    
    // "문의하기" 제목을 가진 요소 찾기
    for (var i = 0; i < allElements.length; i++) {
        var element = allElements[i];
        var textContent = element.textContent || element.innerText || '';
        var tagName = element.tagName.toLowerCase();
        
        // "문의하기" 정확한 텍스트를 가진 제목 요소 찾기
        if ((tagName.match(/^h[1-6]$/) || element.className.includes('title') || element.className.includes('heading')) &&
            textContent.trim() === '문의하기') {
            targetElement = element;
            console.log('문의하기 제목 찾음:', textContent.trim(), element);
            found = true;
            break;
        }
    }
    
    // 방법 2: "문의하기"가 포함된 제목 찾기
    if (!found) {
        console.log('문의하기 포함 제목 찾기');
        
        // 모든 요소에서 "문의하기" 텍스트 검색 (제목 요소 우선)
        for (var i = 0; i < allElements.length; i++) {
            var element = allElements[i];
            var textContent = element.textContent || element.innerText || '';
            var tagName = element.tagName.toLowerCase();
            
            // 제목 요소에서 "문의하기" 포함된 것 찾기
            if ((tagName.match(/^h[1-6]$/) || element.className.includes('title') || element.className.includes('heading')) &&
                textContent.includes('문의하기')) {
                targetElement = element;
                console.log('문의하기 포함 제목 찾음:', textContent.trim(), element);
                found = true;
                break;
            }
        }
        
        // 제목에서 못 찾으면 일반 요소에서도 검색
        if (!found) {
            for (var i = 0; i < allElements.length; i++) {
                var element = allElements[i];
                var textContent = element.textContent || element.innerText || '';
                
                // "문의하기" 텍스트만 있는 요소 찾기 (자식 요소 적은 것 우선)
                if (textContent.trim() === '문의하기' && element.children.length < 3) {
                    targetElement = element;
                    console.log('문의하기 텍스트 요소 찾음:', textContent.trim(), element);
                    found = true;
                    break;
                }
            }
        }
    }
    
    // 방법 3: 이름, 연락처, 연락 희망 시간대 입력 칸 찾기
    if (!found) {
        console.log('입력 칸 찾기 시작');
        
        // 구체적인 입력 필드 찾기
        var nameInput = document.querySelector('input[placeholder*="이름"], input[name*="name"], input[id*="name"]');
        var phoneInput = document.querySelector('input[placeholder*="연락"], input[placeholder*="전화"], input[type="tel"], input[name*="phone"], input[id*="phone"]');
        var timeInput = document.querySelector('input[placeholder*="시간"], input[placeholder*="희망"], input[name*="time"], input[id*="time"]');
        
        var targetInput = nameInput || phoneInput || timeInput;
        
        if (targetInput) {
            console.log('입력 칸 찾음:', targetInput.placeholder || targetInput.name || targetInput.id, targetInput);
            
            // 입력 칸이 속한 폼이나 섹션의 시작 부분 찾기
            var formElement = targetInput.closest('form');
            var sectionElement = targetInput.closest('section, div[class*="contact"], div[class*="form"], div[class*="inquiry"]');
            
            if (formElement) {
                // 폼의 첫 번째 요소 찾기
                var firstElement = formElement.querySelector('h1, h2, h3, h4, h5, h6, label, .title, .heading');
                if (firstElement) {
                    targetElement = firstElement;
                    console.log('폼 시작 부분 찾음:', firstElement.textContent.trim(), firstElement);
                } else {
                    targetElement = formElement;
                    console.log('폼 전체 사용:', formElement);
                }
                found = true;
            } else if (sectionElement) {
                // 섹션의 첫 번째 요소 찾기
                var firstElement = sectionElement.querySelector('h1, h2, h3, h4, h5, h6, label, .title, .heading');
                if (firstElement) {
                    targetElement = firstElement;
                    console.log('섹션 시작 부분 찾음:', firstElement.textContent.trim(), firstElement);
                } else {
                    targetElement = sectionElement;
                    console.log('섹션 전체 사용:', sectionElement);
                }
                found = true;
            } else {
                // 입력 필드 자체 사용
                targetElement = targetInput;
                console.log('입력 필드 직접 사용:', targetInput);
                found = true;
            }
        } else {
            console.log('입력 칸을 찾을 수 없음');
        }
    }
    
    // 스크롤 실행
    if (targetElement) {
        console.log('스크롤 시작:', targetElement);
        
        // 안정적인 스크롤 방법
        try {
            console.log('스크롤 시작');
            
            // 요소의 절대 위치 계산
            var elementTop = 0;
            var element = targetElement;
            
            // 요소의 실제 top 위치 계산
            while (element) {
                elementTop += element.offsetTop;
                element = element.offsetParent;
            }
            
            // 스크롤 위치 계산 (요소 위로 150px 여유)
            var scrollPosition = elementTop - 150;
            
            // 최소값 0, 최대값은 페이지 끝
            scrollPosition = Math.max(0, Math.min(scrollPosition, document.body.scrollHeight - window.innerHeight));
            
            console.log('요소 위치:', elementTop, '스크롤 위치:', scrollPosition);
            
            window.scrollTo({
                top: scrollPosition,
                behavior: 'smooth'
            });
            
        } catch (e) {
            console.log('스크롤 에러:', e);
            
            // 에러 시 간단한 scrollIntoView 사용
            targetElement.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start'
            });
        }
        
        // 강조 효과
        targetElement.style.outline = '3px solid #FF6B35';
        targetElement.style.backgroundColor = 'rgba(255, 107, 53, 0.1)';
        setTimeout(function() {
            targetElement.style.outline = '';
            targetElement.style.backgroundColor = '';
        }, 3000);
        
    } else {
        console.log('타겟을 못 찾음 - 페이지 맨 아래로 이동');
        window.scrollTo({
            top: document.body.scrollHeight - window.innerHeight,
            behavior: 'smooth'
        });
    }
    
    // 버튼 클릭 피드백
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.style.transform = 'scale(0.9)';
        setTimeout(function() {
            btn.style.transform = '';
        }, 200);
    }
}

// 페이지 로드 완료 후 이벤트 등록
document.addEventListener('DOMContentLoaded', function() {
    console.log('페이지 로드 완료'); // 디버깅용
    
    // 버튼에 클릭 이벤트 등록 (onclick 외에 추가로)
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('addEventListener로 클릭 감지!');
            findAndScrollToContact();
        });
        
        // 터치 이벤트도 추가 (모바일용)
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            console.log('터치 이벤트 감지!');
            findAndScrollToContact();
        });
    }
});

// 추가 안전장치: 윈도우 로드 후에도 이벤트 등록
window.addEventListener('load', function() {
    var btn = document.querySelector('.contact-btn');
    if (btn && !btn.hasAttribute('data-event-added')) {
        btn.setAttribute('data-event-added', 'true');
        btn.onclick = function() {
            console.log('onclick 직접 등록으로 클릭 감지!');
            findAndScrollToContact();
            return false;
        };
    }
});
</script>
