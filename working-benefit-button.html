<style>
.contact-btn {
    position: fixed !important;
    bottom: 20px;
    right: 20px;
    width: 85px;
    height: 85px;
    background: linear-gradient(135deg, #FF6B35, #F7931E) !important;
    border-radius: 20px !important;
    box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4) !important;
    cursor: pointer !important;
    z-index: 999999 !important;
    transition: all 0.3s ease !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    color: #ffffff !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    text-align: center !important;
    border: none !important;
    outline: none !important;
    pointer-events: auto !important;
    -webkit-tap-highlight-color: rgba(255, 107, 53, 0.3) !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
}

.contact-btn:hover {
    transform: translateY(-5px) scale(1.05) !important;
    box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6) !important;
    background: linear-gradient(135deg, #FF5722, #E65100) !important;
    color: #ffffff !important;
    text-decoration: none !important;
}

.contact-btn:focus,
.contact-btn:visited {
    color: #ffffff !important;
    text-decoration: none !important;
    outline: none !important;
}

.contact-icon {
    font-size: 28px !important;
    margin-bottom: 3px !important;
    animation: bounce-icon 2s infinite !important;
}

.contact-text {
    font-size: 11px !important;
    line-height: 1.1 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
}

@keyframes bounce-icon {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
    60% { transform: translateY(-3px); }
}

@media (max-width: 768px) {
    .contact-btn {
        width: 75px !important;
        height: 75px !important;
        bottom: 15px !important;
        right: 15px !important;
    }
    
    .contact-icon {
        font-size: 24px !important;
    }
    
    .contact-text {
        font-size: 10px !important;
    }
}
</style>

<div class="contact-btn" onclick="findAndScrollToContact(); return false;">
    <div class="contact-icon">🎁</div>
    <div class="contact-text">무료혜택<br>신청하기</div>
</div>

<script>
function findAndScrollToContact() {
    console.log('버튼 클릭됨!'); // 디버깅용
    
    var targetElement = null;
    var found = false;
    
    // 방법 1: 이름, 연락처 입력 폼 찾기 (가장 우선)
    var allElements = document.getElementsByTagName('*');
    console.log('전체 요소 개수:', allElements.length);
    
    // 이름, 연락처 등 입력 필드가 있는 폼 찾기
    var inputElements = document.querySelectorAll('input[type="text"], input[type="tel"], input[type="email"], input[placeholder*="이름"], input[placeholder*="연락"], input[placeholder*="전화"], textarea');
    
    if (inputElements.length > 0) {
        // 가장 아래쪽에 있는 입력 필드의 부모 폼 찾기
        var lastInput = inputElements[inputElements.length - 1];
        
        // 입력 필드의 부모 폼이나 섹션 찾기
        var parentForm = lastInput.closest('form');
        if (parentForm) {
            targetElement = parentForm;
            console.log('입력 폼 찾음:', parentForm);
            found = true;
        } else {
            // 폼이 없으면 입력 필드가 있는 섹션 찾기
            var parentSection = lastInput.closest('section, div, .contact, .form, .inquiry');
            if (parentSection) {
                targetElement = parentSection;
                console.log('입력 섹션 찾음:', parentSection);
                found = true;
            } else {
                targetElement = lastInput;
                console.log('입력 필드 찾음:', lastInput);
                found = true;
            }
        }
    }
    
    // 방법 2: "문의하기" 제목이 있는 섹션 찾기
    if (!found) {
        console.log('문의하기 제목 섹션 찾기');
        
        for (var i = allElements.length - 1; i >= 0; i--) {
            var element = allElements[i];
            var textContent = element.textContent || element.innerText || '';
            var tagName = element.tagName.toLowerCase();
            
            // "문의하기" 제목을 가진 요소 찾기 (h1, h2, h3 등)
            if ((tagName.match(/^h[1-6]$/) || element.className.includes('title') || element.className.includes('heading')) &&
                textContent.includes('문의하기')) {
                targetElement = element;
                console.log('문의하기 제목 찾음:', textContent.trim(), element);
                found = true;
                break;
            }
        }
    }
    
    // 방법 3: 폼이나 연락처 관련 섹션 찾기
    if (!found) {
        console.log('폼이나 연락처 섹션 찾기');
        
        for (var i = allElements.length - 1; i >= 0; i--) {
            var element = allElements[i];
            var textContent = element.textContent || element.innerText || '';
            var tagName = element.tagName.toLowerCase();
            
            // 폼이나 연락처 관련 텍스트가 있는 요소 찾기
            if (tagName === 'form' || 
                textContent.includes('연락처') || textContent.includes('이름') ||
                textContent.includes('연락 희망 시간') || textContent.includes('문의') ||
                element.className.includes('contact') || element.className.includes('form')) {
                targetElement = element;
                console.log('연락처/폼 섹션 찾음:', textContent.substring(0, 30), element);
                found = true;
                break;
            }
        }
    }
    
    // 스크롤 실행
    if (targetElement) {
        console.log('스크롤 시작:', targetElement);
        
        // 여러 방법으로 스크롤 시도
        try {
            // 방법 1: scrollIntoView
            targetElement.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center',
                inline: 'nearest'
            });
            
            // 방법 2: 직접 위치 계산해서 스크롤
            setTimeout(function() {
                var rect = targetElement.getBoundingClientRect();
                var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                var targetY = scrollTop + rect.top - (window.innerHeight / 2);
                
                window.scrollTo({
                    top: targetY,
                    behavior: 'smooth'
                });
                
                console.log('스크롤 위치:', targetY);
            }, 100);
            
        } catch (e) {
            console.log('스크롤 에러:', e);
            // 에러 시 기본 스크롤
            window.scrollTo({
                top: targetElement.offsetTop - 100,
                behavior: 'smooth'
            });
        }
        
        // 강조 효과
        targetElement.style.outline = '3px solid #FF6B35';
        targetElement.style.backgroundColor = 'rgba(255, 107, 53, 0.1)';
        setTimeout(function() {
            targetElement.style.outline = '';
            targetElement.style.backgroundColor = '';
        }, 3000);
        
    } else {
        console.log('타겟을 못 찾음 - 페이지 맨 아래로 이동');
        window.scrollTo({
            top: document.body.scrollHeight - window.innerHeight,
            behavior: 'smooth'
        });
    }
    
    // 버튼 클릭 피드백
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.style.transform = 'scale(0.9)';
        setTimeout(function() {
            btn.style.transform = '';
        }, 200);
    }
}

// 페이지 로드 완료 후 이벤트 등록
document.addEventListener('DOMContentLoaded', function() {
    console.log('페이지 로드 완료'); // 디버깅용
    
    // 버튼에 클릭 이벤트 등록 (onclick 외에 추가로)
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('addEventListener로 클릭 감지!');
            findAndScrollToContact();
        });
        
        // 터치 이벤트도 추가 (모바일용)
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            console.log('터치 이벤트 감지!');
            findAndScrollToContact();
        });
    }
});

// 추가 안전장치: 윈도우 로드 후에도 이벤트 등록
window.addEventListener('load', function() {
    var btn = document.querySelector('.contact-btn');
    if (btn && !btn.hasAttribute('data-event-added')) {
        btn.setAttribute('data-event-added', 'true');
        btn.onclick = function() {
            console.log('onclick 직접 등록으로 클릭 감지!');
            findAndScrollToContact();
            return false;
        };
    }
});
</script>
