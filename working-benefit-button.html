<style>
.contact-btn {
    position: fixed !important;
    top: 50% !important;
    right: 20px;
    transform: translateY(-50%) !important;
    width: 160px;
    height: 160px;
    background: linear-gradient(135deg, #FF6B35, #F7931E) !important;
    border-radius: 15px !important;
    box-shadow: 0 12px 35px rgba(255, 107, 53, 0.4) !important;
    cursor: pointer !important;
    z-index: 999999 !important;
    transition: all 0.3s ease !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    color: #ffffff !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    text-align: center !important;
    border: none !important;
    outline: none !important;
    pointer-events: auto !important;
    -webkit-tap-highlight-color: rgba(255, 107, 53, 0.3) !important;
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
}

.contact-btn:hover {
    transform: translateY(-50%) translateX(-10px) scale(1.08) !important;
    box-shadow: 0 18px 50px rgba(255, 107, 53, 0.6) !important;
    background: linear-gradient(135deg, #FF5722, #E65100) !important;
    color: #ffffff !important;
    text-decoration: none !important;
}

.contact-btn:focus,
.contact-btn:visited {
    color: #ffffff !important;
    text-decoration: none !important;
    outline: none !important;
}

.contact-icon {
    font-size: 70px !important;
    margin-bottom: 5px !important;
    animation: bounce-icon 2s infinite !important;
}

.contact-text {
    font-size: 24px !important;
    line-height: 1.1 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3) !important;
    margin-top: -5px !important;
}

@keyframes bounce-icon {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
    60% { transform: translateY(-3px); }
}

@media (max-width: 768px) {
    .contact-btn {
        width: 110px !important;
        height: 110px !important;
        right: 15px !important;
        font-size: 15px !important;
    }
    
    .contact-icon {
        font-size: 40px !important;
        margin-bottom: 2px !important;
    }
    
    .contact-text {
        font-size: 16px !important;
    }
}

@media (max-width: 480px) {
    .contact-btn {
        width: 95px !important;
        height: 95px !important;
        right: 10px !important;
    }
    
              .contact-icon {
         font-size: 36px !important;
     }
    
                   .contact-text {
          font-size: 16px !important;
      }
}
</style>

<div class="contact-btn" onclick="findAndScrollToContact(); return false;">
    <div class="contact-icon">🎁</div>
    <div class="contact-text">무료혜택<br>신청하기</div>
</div>

<script>
function findAndScrollToContact() {
    console.log('버튼 클릭됨!'); // 디버깅용
    
    // 페이지 전체 높이 계산
    var pageHeight = Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.clientHeight,
        document.documentElement.scrollHeight,
        document.documentElement.offsetHeight
    );
    
    // 화면 높이
    var windowHeight = window.innerHeight;
    
    // 맨 아래에서 3칸 위 정도로 계산 (대략 300px 위)
    var scrollPosition = pageHeight - windowHeight - 300;
    
    // 최소값 보정 (너무 위로 올라가지 않도록)
    scrollPosition = Math.max(0, scrollPosition);
    
    console.log('페이지 높이:', pageHeight, '스크롤 위치:', scrollPosition);
    
    // 부드럽게 스크롤
    window.scrollTo({
        top: scrollPosition,
        behavior: 'smooth'
    });
    
    // 버튼 클릭 피드백
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.style.transform = 'scale(0.9)';
        setTimeout(function() {
            btn.style.transform = '';
        }, 200);
    }
}

// 페이지 로드 완료 후 이벤트 등록
document.addEventListener('DOMContentLoaded', function() {
    console.log('페이지 로드 완료'); // 디버깅용
    
    // 버튼에 클릭 이벤트 등록 (onclick 외에 추가로)
    var btn = document.querySelector('.contact-btn');
    if (btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('addEventListener로 클릭 감지!');
            findAndScrollToContact();
        });
        
        // 터치 이벤트도 추가 (모바일용)
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            console.log('터치 이벤트 감지!');
            findAndScrollToContact();
        });
    }
});

// 추가 안전장치: 윈도우 로드 후에도 이벤트 등록
window.addEventListener('load', function() {
    var btn = document.querySelector('.contact-btn');
    if (btn && !btn.hasAttribute('data-event-added')) {
        btn.setAttribute('data-event-added', 'true');
        btn.onclick = function() {
            console.log('onclick 직접 등록으로 클릭 감지!');
            findAndScrollToContact();
            return false;
        };
    }
});
</script>
