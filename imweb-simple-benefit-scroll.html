<!-- 아임웹 무료 혜택 신청 스크롤 버튼 - 간단 버전 -->
<style>
.benefit-scroll-btn {
    position: fixed !important;
    bottom: 20px;
    right: 20px;
    width: 85px;
    height: 85px;
    background: linear-gradient(135deg, #FF6B35, #F7931E) !important;
    border-radius: 20px !important;
    box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4) !important;
    cursor: pointer !important;
    z-index: 999999 !important;
    transition: all 0.3s ease !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    color: #ffffff !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    text-align: center !important;
    border: none !important;
    outline: none !important;
    opacity: 0;
    transform: translateY(50px);
}

.benefit-scroll-btn:hover {
    transform: translateY(-8px) scale(1.05) !important;
    box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6) !important;
    background: linear-gradient(135deg, #FF5722, #E65100) !important;
    color: #ffffff !important;
    text-decoration: none !important;
}

.benefit-scroll-btn:focus,
.benefit-scroll-btn:visited {
    color: #ffffff !important;
    text-decoration: none !important;
    outline: none !important;
}

.benefit-scroll-btn.show {
    opacity: 1 !important;
    transform: translateY(0) !important;
    transition: all 0.5s ease !important;
}

.benefit-icon {
    font-size: 28px !important;
    margin-bottom: 3px !important;
    animation: bounce-gift 2s infinite !important;
}

.benefit-text {
    font-size: 11px !important;
    line-height: 1.1 !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3) !important;
}

@keyframes bounce-gift {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
    60% { transform: translateY(-3px); }
}

.benefit-scroll-btn.pulse {
    animation: pulse-orange 2s infinite !important;
}

@keyframes pulse-orange {
    0% { box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4), 0 0 0 0 rgba(255, 107, 53, 0.7) !important; }
    70% { box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4), 0 0 0 15px rgba(255, 107, 53, 0) !important; }
    100% { box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4), 0 0 0 0 rgba(255, 107, 53, 0) !important; }
}

@media (max-width: 768px) {
    .benefit-scroll-btn {
        width: 75px !important;
        height: 75px !important;
        bottom: 15px !important;
        right: 15px !important;
        border-radius: 18px !important;
    }
    
    .benefit-icon {
        font-size: 24px !important;
    }
    
    .benefit-text {
        font-size: 10px !important;
    }
}
</style>

<a href="javascript:void(0)" class="benefit-scroll-btn" onclick="scrollToBenefit()" id="benefitBtn">
    <span class="benefit-icon">🎁</span>
    <span class="benefit-text">무료혜택<br>신청하기</span>
</a>

<script>
// 🔧 설정: 아래 값들을 사이트에 맞게 수정하세요
var SCROLL_TARGET = {
    // 방법 1: CSS 선택자로 지정 (가장 정확함)
    selector: null, // 예: '#benefit-section', '.apply-form', '#contact'
    
    // 방법 2: 텍스트로 찾기
    searchText: '무료 혜택 신청', // 찾고자 하는 텍스트
    
    // 방법 3: 페이지 맨 아래로 (기본값)
    scrollToBottom: true,
    
    // 기타 설정
    showAfterScroll: 150, // 150px 스크롤 후 버튼 표시
    offset: -100 // 타겟 위치에서 추가 오프셋 (음수면 위로, 양수면 아래로)
};

function scrollToBenefit() {
    var target = null;
    
    // 방법 1: 지정된 선택자로 찾기
    if (SCROLL_TARGET.selector) {
        target = document.querySelector(SCROLL_TARGET.selector);
    }
    
    // 방법 2: 텍스트로 찾기
    if (!target && SCROLL_TARGET.searchText) {
        var elements = document.querySelectorAll('*');
        for (var i = elements.length - 1; i >= 0; i--) {
            var el = elements[i];
            if (el.textContent && el.textContent.includes(SCROLL_TARGET.searchText)) {
                target = el;
                break;
            }
        }
    }
    
    // 방법 3: 일반적인 키워드로 찾기
    if (!target) {
        var keywords = ['신청', '혜택', '무료', 'submit', 'apply', 'contact', '문의', '등록'];
        var elements = document.querySelectorAll('button, a, .btn, .button, form');
        
        for (var k = 0; k < keywords.length; k++) {
            for (var i = elements.length - 1; i >= 0; i--) {
                var el = elements[i];
                if (el.textContent && el.textContent.toLowerCase().includes(keywords[k])) {
                    target = el;
                    break;
                }
            }
            if (target) break;
        }
    }
    
    // 방법 4: 페이지 하단 섹션들 찾기
    if (!target) {
        var bottomSelectors = ['footer', '.footer', '#footer', 'body > *:last-child', 'main > *:last-child'];
        for (var i = 0; i < bottomSelectors.length; i++) {
            target = document.querySelector(bottomSelectors[i]);
            if (target) break;
        }
    }
    
    // 스크롤 실행
    var scrollPosition;
    if (target) {
        scrollPosition = target.offsetTop + SCROLL_TARGET.offset;
    } else if (SCROLL_TARGET.scrollToBottom) {
        scrollPosition = document.body.scrollHeight;
    } else {
        scrollPosition = 0;
    }
    
    window.scrollTo({
        top: Math.max(0, scrollPosition),
        behavior: 'smooth'
    });
    
    // 타겟 강조 효과 (2초간)
    if (target) {
        var originalStyle = target.style.cssText;
        target.style.outline = '3px solid #FF6B35';
        target.style.boxShadow = '0 0 20px rgba(255, 107, 53, 0.5)';
        
        setTimeout(function() {
            target.style.cssText = originalStyle;
        }, 2000);
    }
    
    // Google Analytics 이벤트 (있으면 자동 전송)
    if (typeof gtag !== 'undefined') {
        gtag('event', 'click', {
            'event_category': 'floating_button',
            'event_label': 'scroll_to_benefit'
        });
    }
}

// 버튼 초기화 및 스크롤 이벤트
(function() {
    var btn = document.getElementById('benefitBtn');
    if (!btn) return;
    
    // 페이지 로드 후 버튼 표시
    setTimeout(function() {
        btn.classList.add('show');
    }, 800);
    
    // 스크롤 이벤트
    var scrollTimer;
    window.addEventListener('scroll', function() {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop;
        
        // 일정 스크롤 후 표시
        if (scrollY > SCROLL_TARGET.showAfterScroll) {
            btn.classList.add('show');
        } else {
            btn.classList.remove('show');
        }
        
        // 스크롤 중 펄스 효과
        btn.classList.add('pulse');
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
            btn.classList.remove('pulse');
        }, 1000);
    }, { passive: true });
    
    // 주기적 펄스 효과 (8초마다)
    setInterval(function() {
        if (btn.classList.contains('show')) {
            btn.classList.add('pulse');
            setTimeout(function() {
                btn.classList.remove('pulse');
            }, 2000);
        }
    }, 8000);
})();
</script>

<!-- 
📌 사용법:
1. 아임웹 HTML 위젯에 이 코드를 붙여넣기
2. 위의 SCROLL_TARGET 설정을 사이트에 맞게 수정:
   - selector: 정확한 CSS 선택자 (예: '#contact-form')
   - searchText: 찾을 텍스트 (예: '무료 체험 신청')
   - scrollToBottom: true면 페이지 맨 아래로

📌 설정 예시:
// 특정 ID로 이동
SCROLL_TARGET.selector = '#contact';

// 특정 클래스로 이동  
SCROLL_TARGET.selector = '.apply-section';

// 특정 텍스트를 포함한 요소로 이동
SCROLL_TARGET.searchText = '지금 신청하기';

// 페이지 맨 아래로
SCROLL_TARGET.scrollToBottom = true;
-->
