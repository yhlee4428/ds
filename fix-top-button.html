<script>
// 기존 맨 위로 버튼 수정
document.addEventListener('DOMContentLoaded', function() {
    // 기존 맨 위로 버튼 찾기
    var topButton = document.querySelector('.floating-button.top');
    var topButtonAlt = document.querySelector('a[href="#doz_header"]');
    var targetButton = topButton || topButtonAlt;
    
    if (targetButton) {
        console.log('맨 위로 버튼 찾음:', targetButton);
        
        // 기존 클릭 이벤트 제거하고 새로 등록
        targetButton.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            console.log('맨 위로 버튼 클릭됨!');
            
            // 페이지 맨 위로 부드럽게 스크롤
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            
            // 클릭 피드백
            targetButton.style.transform = 'scale(0.9)';
            setTimeout(function() {
                targetButton.style.transform = '';
            }, 150);
            
            return false;
        };
        
        // 추가 이벤트 리스너도 등록
        targetButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            console.log('addEventListener로 맨 위로 클릭 감지!');
            
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        
        // 터치 이벤트도 추가 (모바일용)
        targetButton.addEventListener('touchstart', function(e) {
            e.preventDefault();
            console.log('터치로 맨 위로 클릭!');
            
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        
        console.log('맨 위로 버튼 이벤트 등록 완료');
    } else {
        console.log('맨 위로 버튼을 찾을 수 없습니다.');
    }
});

// 추가 안전장치: 윈도우 로드 후에도 다시 시도
window.addEventListener('load', function() {
    var topButton = document.querySelector('.floating-button.top');
    var topButtonAlt = document.querySelector('a[href="#doz_header"]');
    var targetButton = topButton || topButtonAlt;
    
    if (targetButton && !targetButton.hasAttribute('data-fixed')) {
        targetButton.setAttribute('data-fixed', 'true');
        
        // href 속성 제거 (충돌 방지)
        targetButton.removeAttribute('href');
        
        targetButton.onclick = function(e) {
            e.preventDefault();
            console.log('윈도우 로드 후 맨 위로 클릭!');
            
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            return false;
        };
        
        console.log('윈도우 로드 후 맨 위로 버튼 수정 완료');
    }
});

// 강제로 모든 맨 위로 링크 수정
setTimeout(function() {
    var allTopLinks = document.querySelectorAll('a[href*="#"], a[href*="top"], .floating-button, .top-button');
    
    for (var i = 0; i < allTopLinks.length; i++) {
        var link = allTopLinks[i];
        var text = link.textContent || link.innerHTML || '';
        
        // "위" 또는 "top" 관련 텍스트가 있는 링크 찾기
        if (text.includes('위') || text.includes('top') || text.includes('TOP') || 
            link.className.includes('top') || link.href.includes('#')) {
            
            console.log('맨 위로 관련 링크 찾음:', link);
            
            link.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                console.log('강제 수정된 맨 위로 클릭!');
                
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
                
                return false;
            };
        }
    }
}, 1000);
</script>
